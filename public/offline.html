<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rimiris AI — Hors ligne</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6D28D9" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, oklch(0.99 0.005 280) 0%, oklch(0.96 0.015 280) 100%);
      color: oklch(0.18 0.02 280);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .card {
      max-width: 28rem;
      width: calc(100% - 2rem);
      padding: 2.5rem 2rem;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(109, 40, 217, 0.18);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, oklch(0.42 0.18 285) 0%, oklch(0.55 0.2 305) 50%, oklch(0.72 0.15 75) 100%);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 36px; height: 36px; color: white; }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      font-weight: 700;
    }
    p {
      color: oklch(0.52 0.025 280);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, oklch(0.42 0.18 285) 0%, oklch(0.55 0.2 305) 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    .small { font-size: 0.75rem; color: oklch(0.62 0.02 280); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Rimiris AI ne peut pas atteindre le serveur pour le moment. Vérifiez votre connexion internet puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
    <p class="small">Astuce : une fois en ligne, les sections déjà rédigées restent disponibles dans votre navigateur.</p>
  </div>
</body>
</html>
